name: app

on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # ملفات المنصات غير محفوظة في المستودع بعد؛ نولّدها هنا.
      - run: flutter create . --org sa.mirqah --project-name mirqah --platforms=web
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
